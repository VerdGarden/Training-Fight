<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Strike Trainer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:monospace; }

#overlay {
  position:fixed; inset:0; z-index:100;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,0.88); color:#fff;
}
#overlay h1 { font-size:2.2rem; color:#ff4444; letter-spacing:5px; margin-bottom:.4rem; }
#overlay .sub { color:#666; font-size:.85rem; margin-bottom:1.8rem; max-width:380px; text-align:center; line-height:1.7; }
#btn-start {
  background:#ff4444; color:#fff; border:none;
  padding:1rem 3rem; font-size:1.1rem; border-radius:3px;
  cursor:pointer; letter-spacing:3px; font-family:monospace;
}
#btn-start:hover { background:#cc2222; }

#hud {
  position:fixed; top:0; left:0; right:0;
  display:none; justify-content:space-between;
  padding:.8rem 1.5rem; z-index:50; pointer-events:none;
}
.hb {
  background:rgba(0,0,0,.7); border:1px solid #ff4444;
  color:#ff4444; padding:.4rem .9rem; border-radius:3px; font-size:1rem;
}

#prompt {
  position:fixed; bottom:2.5rem; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.8); border:2px solid #ffaa00;
  color:#ffaa00; padding:.5rem 2rem; border-radius:3px;
  font-size:1.4rem; letter-spacing:3px; z-index:50;
  display:none; white-space:nowrap;
}
#timer-bar-wrap {
  position:fixed; bottom:2rem; left:50%; transform:translateX(-50%);
  width:260px; height:5px; background:#222; border-radius:3px;
  display:none; z-index:50;
}
#timer-bar { height:5px; background:#ffaa00; border-radius:3px; width:100%; transition:width linear; }

#msg {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  font-size:2rem; font-family:monospace; font-weight:bold;
  z-index:60; pointer-events:none; opacity:0; transition:opacity .15s;
}
</style>
</head>
<body>

<!-- Three.js CDN classico (no importmap, funziona ovunque) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

<div id="overlay">
  <h1>⚡ STRIKE TRAINER</h1>
  <div class="sub">
    Il punto si illumina → colpisci con il mouse (o controller VR).<br>
    Allenati su gola, naso, plesso, occhi, tempia, inguine, ginocchio.
  </div>
  <button id="btn-start">INIZIA</button>
  <div style="margin-top:1.4rem;color:#333;font-size:.75rem;">
    Su Meta Quest: apri in Oculus Browser → "Enter VR"
  </div>
</div>

<div id="hud">
  <div class="hb">COLPI <span id="score">0</span></div>
  <div class="hb">REAZIONE <span id="react">—</span> ms</div>
  <div class="hb">COMBO <span id="combo">0</span> 🔥</div>
</div>

<div id="prompt">COLPISCI: <span id="tname">—</span></div>
<div id="timer-bar-wrap"><div id="timer-bar"></div></div>
<div id="msg"></div>

<script>
// ─── Audio ────────────────────────────────────────────────────
const AC = new (window.AudioContext || window.webkitAudioContext)();
function tone(freq, type, dur, vol=0.5) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  o.start(); o.stop(AC.currentTime + dur);
}
function sfxHit(combo) {
  tone(combo > 2 ? 280 : 180, 'square', .18, .55);
  if (combo > 2) setTimeout(()=>tone(380,'triangle',.12,.35), 80);
}
function sfxMiss() { tone(180,'sine',.35,.3); }
function sfxCombo(n) {
  [0,.1,.2].forEach((t,i)=>{
    setTimeout(()=>tone(300+i*130+n*15,'triangle',.15,.4), t*1000);
  });
}

// ─── Flash msg ────────────────────────────────────────────────
const msgEl = document.getElementById('msg');
function flash(text, color, dur=600) {
  msgEl.textContent = text;
  msgEl.style.color = color;
  msgEl.style.opacity = 1;
  setTimeout(()=>{ msgEl.style.opacity=0; }, dur);
}

// ─── Three.js setup ───────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Abilita WebXR se supportato
if (navigator.xr) {
  renderer.xr.enabled = true;
  navigator.xr.isSessionSupported('immersive-vr').then(sup => {
    if (sup) {
      const vrBtn = document.createElement('button');
      vrBtn.textContent = '🥽 ENTRA IN VR';
      vrBtn.style.cssText = 'position:fixed;bottom:1rem;right:1rem;z-index:200;background:#ff4444;color:#fff;border:none;padding:.6rem 1.2rem;font-family:monospace;font-size:.9rem;border-radius:3px;cursor:pointer;';
      vrBtn.onclick = () => {
        navigator.xr.requestSession('immersive-vr').then(session => {
          renderer.xr.setSession(session);
        });
      };
      document.body.appendChild(vrBtn);
    }
  });
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080810);
scene.fog = new THREE.FogExp2(0x080810, 0.055);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 1.6, 2.8);

// ─── Luci ─────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x112233, 2));
const dir = new THREE.DirectionalLight(0xffffff, 1.4);
dir.position.set(3,6,4); dir.castShadow=true;
scene.add(dir);
const rim = new THREE.PointLight(0xff2200, 2.5, 8);
rim.position.set(-2,2.5,-1); scene.add(rim);
const fill = new THREE.PointLight(0x0033ff, 1, 10);
fill.position.set(2,1.5,2); scene.add(fill);

// ─── Pavimento ────────────────────────────────────────────────
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20,20),
  new THREE.MeshStandardMaterial({color:0x0d0d18, roughness:.95})
);
floor.rotation.x = -Math.PI/2; floor.receiveShadow=true;
scene.add(floor);
scene.add(new THREE.GridHelper(16,16,0x1a1a2e,0x1a1a2e));

// ─── Manichino ────────────────────────────────────────────────
const mGroup = new THREE.Group();
mGroup.position.set(0,0,0);
scene.add(mGroup);

const bMat = new THREE.MeshStandardMaterial({color:0x2a3a50, roughness:.7, metalness:.15});
const jMat = new THREE.MeshStandardMaterial({color:0x1e2d3d, roughness:.8});

function part(geo, mat, x,y,z, rx=0,ry=0,rz=0) {
  const m = new THREE.Mesh(geo, mat.clone());
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow=true; mGroup.add(m); return m;
}

// Busto
part(new THREE.BoxGeometry(.44,.54,.22), bMat, 0,1.16,0);
// Pelvi
part(new THREE.BoxGeometry(.37,.21,.19), bMat, 0,.84,0);
// Testa
part(new THREE.SphereGeometry(.135,20,20), bMat, 0,1.73,0);
// Collo
part(new THREE.CylinderGeometry(.055,.065,.13,12), bMat, 0,1.59,0);
// Braccia sup
part(new THREE.CylinderGeometry(.058,.052,.27,10), jMat, -.31,1.31,0, 0,0, .36);
part(new THREE.CylinderGeometry(.058,.052,.27,10), jMat,  .31,1.31,0, 0,0,-.36);
// Avambracci
part(new THREE.CylinderGeometry(.048,.042,.25,10), jMat, -.54,1.09,0, 0,0, .52);
part(new THREE.CylinderGeometry(.048,.042,.25,10), jMat,  .54,1.09,0, 0,0,-.52);
// Coscie
part(new THREE.CylinderGeometry(.088,.078,.37,12), bMat, -.13,.57,0);
part(new THREE.CylinderGeometry(.088,.078,.37,12), bMat,  .13,.57,0);
// Gambe
part(new THREE.CylinderGeometry(.068,.052,.35,12), bMat, -.13,.20,0);
part(new THREE.CylinderGeometry(.068,.052,.35,12), bMat,  .13,.20,0);
// Piedi
part(new THREE.BoxGeometry(.11,.055,.20), bMat, -.13,.03,.05);
part(new THREE.BoxGeometry(.11,.055,.20), bMat,  .13,.03,.05);

// ─── Target zones ─────────────────────────────────────────────
const TARGETS = [
  { id:'throat', name:'GOLA',          pos:new THREE.Vector3(0,   1.57, .09), r:.072 },
  { id:'nose',   name:'NASO',          pos:new THREE.Vector3(0,   1.68, .13), r:.058 },
  { id:'solar',  name:'PLESSO',        pos:new THREE.Vector3(0,   1.19, .12), r:.09  },
  { id:'groin',  name:'INGUINE',       pos:new THREE.Vector3(0,   .82,  .11), r:.08  },
  { id:'knee',   name:'GINOCCHIO',     pos:new THREE.Vector3(-.13,.38,  .09), r:.08  },
  { id:'eyes',   name:'OCCHI',         pos:new THREE.Vector3(0,   1.69, .14), r:.058 },
  { id:'temple', name:'TEMPIA',        pos:new THREE.Vector3(.13, 1.68, .03), r:.062 },
];

const tMeshes = [];
TARGETS.forEach((t,i) => {
  const mat = new THREE.MeshStandardMaterial({
    color:0x1a2a3a, emissive:0x000000,
    roughness:.4, metalness:.4,
    transparent:true, opacity:0
  });
  const m = new THREE.Mesh(new THREE.SphereGeometry(t.r,18,18), mat);
  m.position.copy(t.pos);
  m.userData.ti = i;
  mGroup.add(m);
  tMeshes.push(m);

  // anello indicatore sottile sempre visibile
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(t.r+.01, .008, 8, 24),
    new THREE.MeshBasicMaterial({color:0x334455, transparent:true, opacity:.3})
  );
  ring.position.copy(t.pos);
  ring.lookAt(new THREE.Vector3(t.pos.x, t.pos.y, t.pos.z+1));
  mGroup.add(ring);
});

// ─── Game state ───────────────────────────────────────────────
let score=0, combo=0, activeIdx=null, tStart=0, running=false;
let missTimer=null, timerAnim=null;
const TIME_LIMIT = 3000;

const scoreEl = document.getElementById('score');
const reactEl = document.getElementById('react');
const comboEl = document.getElementById('combo');
const promptEl = document.getElementById('prompt');
const tnameEl  = document.getElementById('tname');
const timerBarWrap = document.getElementById('timer-bar-wrap');
const timerBar = document.getElementById('timer-bar');

function updateHUD() {
  scoreEl.textContent = score;
  comboEl.textContent = combo;
}

function showTarget(idx) {
  // reset tutti
  tMeshes.forEach(m => {
    m.material.opacity = 0;
    m.material.emissive.setHex(0x000000);
    m.scale.setScalar(1);
  });
  if (idx === null) {
    activeIdx = null;
    promptEl.style.display = 'none';
    timerBarWrap.style.display = 'none';
    return;
  }
  activeIdx = idx;
  tStart = performance.now();

  const m = tMeshes[idx];
  m.material.color.setHex(0xff6600);
  m.material.emissive.setHex(0xff3300);
  m.material.opacity = .8;

  tnameEl.textContent = TARGETS[idx].name;
  promptEl.style.display = 'block';

  // timer bar
  timerBarWrap.style.display = 'block';
  timerBar.style.transition = 'none';
  timerBar.style.width = '100%';
  timerBar.style.background = '#ffaa00';
  // forza reflow
  timerBar.offsetWidth;
  timerBar.style.transition = `width ${TIME_LIMIT}ms linear`;
  timerBar.style.width = '0%';

  clearTimeout(missTimer);
  missTimer = setTimeout(onMiss, TIME_LIMIT);
}

function nextTarget() {
  if (!running) return;
  let next;
  do { next = Math.floor(Math.random()*TARGETS.length); }
  while (next === activeIdx && TARGETS.length > 1);
  showTarget(next);
}

function onHit(idx) {
  if (!running) return;
  clearTimeout(missTimer);

  if (idx !== activeIdx) {
    flash('SBAGLIATO ✗', '#ff4444');
    sfxMiss();
    combo = 0; updateHUD();
    bodyFlash(0xff2200);
    setTimeout(nextTarget, 600);
    return;
  }

  const ms = Math.round(performance.now() - tStart);
  score += Math.max(1, Math.floor(800/(ms+1)) + combo);
  combo++;
  updateHUD();
  reactEl.textContent = ms;

  tMeshes[idx].material.color.setHex(0x00ff88);
  tMeshes[idx].material.emissive.setHex(0x00ff44);
  bodyFlash(0x00ff44);

  if (combo >= 3) {
    sfxCombo(combo);
    flash(`COMBO x${combo} 🔥`, '#ffaa00');
  } else {
    sfxHit(combo);
    flash('✓', '#00ff88', 350);
  }

  setTimeout(nextTarget, 350);
}

function onMiss() {
  sfxMiss();
  flash('TROPPO LENTO ✗', '#ff4444');
  bodyFlash(0xff2200);
  combo = 0; updateHUD();
  showTarget(null);
  setTimeout(nextTarget, 800);
}

let bodyFlashTimeout;
function bodyFlash(hex) {
  mGroup.children.forEach(c => {
    if (c.material && c.material.emissive && c.userData.ti === undefined) {
      c.material.emissive.setHex(hex);
    }
  });
  clearTimeout(bodyFlashTimeout);
  bodyFlashTimeout = setTimeout(()=>{
    mGroup.children.forEach(c => {
      if (c.material && c.material.emissive && c.userData.ti === undefined)
        c.material.emissive.setHex(0x000000);
    });
  }, 200);
}

// ─── Start ────────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', ()=>{
  AC.resume();
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  running = true;
  updateHUD();
  setTimeout(nextTarget, 800);
});

// ─── Mouse click / raycast ────────────────────────────────────
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('click', e => {
  if (!running) return;
  mouse.x =  (e.clientX/innerWidth)*2 - 1;
  mouse.y = -(e.clientY/innerHeight)*2 + 1;
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(tMeshes, false);
  if (hits.length) {
    onHit(hits[0].object.userData.ti);
  } else if (activeIdx !== null) {
    onMiss();
  }
});

// ─── VR controller (se disponibile) ──────────────────────────
if (navigator.xr) {
  [0,1].forEach(i => {
    const ctrl = renderer.xr.getController(i);
    ctrl.addEventListener('selectstart', () => {
      const tmp = new THREE.Matrix4().extractRotation(ctrl.matrixWorld);
      ray.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
      ray.ray.direction.set(0,0,-1).applyMatrix4(tmp);
      const hits = ray.intersectObjects(tMeshes, false);
      if (hits.length) onHit(hits[0].object.userData.ti);
      else if (activeIdx !== null) onMiss();
    });
    // laser
    const laser = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-3)
      ]),
      new THREE.LineBasicMaterial({color:0xff4444})
    );
    ctrl.add(laser);
    scene.add(ctrl);
  });
}

// ─── Resize ───────────────────────────────────────────────────
window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── Render loop ──────────────────────────────────────────────
const clock = new THREE.Clock();

renderer.setAnimationLoop(()=>{
  const dt = clock.getDelta();
  const el = clock.getElapsedTime();

  // Pulsazione target attivo
  if (activeIdx !== null) {
    const m = tMeshes[activeIdx];
    const p = .65 + .35*Math.sin(el*7);
    m.material.opacity = p * .88;
    m.scale.setScalar(.92 + .12*Math.sin(el*9));
    // timer bar colore
    const left = 1 - (performance.now()-tStart)/TIME_LIMIT;
    timerBar.style.background = left < .33 ? '#ff4444' : '#ffaa00';
  }

  // Respiro manichino
  mGroup.rotation.y = Math.sin(el*.35) * .05;

  // Rim pulse
  rim.intensity = 2 + Math.sin(el*1.1)*.8;

  renderer.render(scene, camera);
});
</script>
</body>
</html>
